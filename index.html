<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HELLO</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="bg-cyan-100">
    <div class="flex flex-col items-center justify-center mt-[50px] font-bold">
      <div
        class="flex justify-between w-[1024px] text-black h-[50px] rounded-lg px-4 items-center"
      >
        <p class="text-2xl font-bold">Task List</p>
        <button
          onclick="openForm()"
          class="bg-purple-700 rounded-lg text-slate-200 text-xs px-[10px] py-[5px] font-bold"
        >
          Add task
        </button>
      </div>
      <div id="input-form">
        <form
          id="form-container"
          class="hidden flex-col w-[350px] bg-white px-4 m-2 rounded-xl shadow-lg"
        >
          <div class="flex justify-between items-center pt-2">
            <p class="font-bold">Add Task</p>
            <i
              class="fa-solid fa-xmark cursor-pointer"
              onclick="closeForm()"
            ></i>
          </div>
          <p class="font-bold py-1">Task</p>
          <input
            id="input-task"
            type="text"
            placeholder="web homework"
            required
            class="border rounded-lg px-2 py-1 border-cyan-500"
          />
          <div>
            <p class="font-bold py-1">Priority</p>
            <div class="flex gap-2">
              <button
                type="button"
                onclick="selectPriority('High', this)"
                class="priority-btn border border-red-500 text-red-500 rounded-lg py-1 px-2 hover:bg-red-500 hover:text-white"
              >
                High
              </button>
              <button
                type="button"
                onclick="selectPriority('Medium', this)"
                class="priority-btn border border-yellow-500 text-yellow-500 rounded-lg py-1 px-2 hover:bg-yellow-500 hover:text-white"
              >
                Medium
              </button>
              <button
                type="button"
                onclick="selectPriority('Low', this)"
                class="priority-btn border border-green-500 text-green-500 rounded-lg py-1 px-2 hover:bg-green-500 hover:text-white"
              >
                Low
              </button>
            </div>
          </div>
          <div>
            <p class="font-bold py-1">Status</p>
            <div class="flex gap-2">
              <button
                type="button"
                onclick="selectStatus('To Do', this)"
                class="status-btn border border-cyan-500 text-cyan-500 rounded-lg py-1 px-2 hover:bg-cyan-500 hover:text-white"
              >
                To Do
              </button>
              <button
                type="button"
                onclick="selectStatus('Progress', this)"
                class="status-btn border border-cyan-500 text-cyan-500 rounded-lg py-1 px-2 hover:bg-cyan-500 hover:text-white"
              >
                Progress
              </button>
              <button
                type="button"
                onclick="selectStatus('Done', this)"
                class="status-btn border border-cyan-500 text-cyan-500 rounded-lg py-1 px-2 hover:bg-cyan-500 hover:text-white"
              >
                Done
              </button>
            </div>
          </div>
          <div class="flex justify-end">
            <button
              type="button"
              onclick="AddTask()"
              class="my-2 rounded-lg font-bold bg-purple-700 text-slate-200 text-xs px-[10px] py-[5px]"
            >
              Add
            </button>
          </div>
        </form>

      </div>
      <div
        class="task-container w-[1024px] mt-4 bg-white rounded-lg"
      >
        <div
          class="grid grid-cols-4 bg-white text-slate-200 font-bold p-3 rounded-lg"
        >
          <div class="text-cyan-400">Task</div>
          <div class="text-cyan-400">Priority</div>
          <div class="text-cyan-400">Status</div>
          <div class="text-yellow-400">Action</div>
        </div>

        <div id="task-list" class=""></div>
      </div>

    </div>
    <script src="src/script.js"></script>
  </body>
</html>
